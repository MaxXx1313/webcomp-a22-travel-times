<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

<body>
<h1>Web Component - Boilerplate & Helloworld</h1>

Code Snippet for web build:

    &lt;noi-a22-travel-times style="height: 600px; width: 100%;"&gt;&lt;/noi-a22-travel-times&gt;

Output:

<!--  <hello-world name="Hello World!"></hello-world>-->
<div>
  <noi-a22-travel-times id="webcam" style="height: 670px; width: 100%"></noi-a22-travel-times>
</div>

<script nomodule src="./noi-a22-travel-times.js"></script>
<script type="module" src="./noi-a22-travel-times.esm.js"></script>


<div>
  <div class="btn-group">
    <div class="btn-group__name">Size</div>
    <button onclick="webcam.style.width = '500px'">mobile</button>
    <button onclick="webcam.style.width = '890px'">tablet</button>
    <button onclick="webcam.style.width = '100%'">full</button>
    <button onclick="webcam.style.width = '968px'; webcam.style.height = '800px'">preview</button>
  </div>

  <div class="btn-group">
    <div class="btn-group__name">layout</div>
    <button onclick="webcam.layout = 'mobile'">mobile</button>
    <button onclick="webcam.layout = 'tablet'">tablet</button>
    <button onclick="webcam.layout = 'desktop'">desktop</button>
    <button onclick="webcam.layout = 'auto'">auto</button>
  </div>

  <div class="btn-group">
    <div class="btn-group__name">language</div>
    <button onclick="webcam.language = 'en'">lang: en</button>
    <button onclick="webcam.language = 'it'">lang: it</button>
    <button onclick="webcam.language = 'xx'">lang: xx (missing)</button>
    <button onclick="webcam.language = null">lang: auto</button>
  </div>

  <div class="btn-group">
    <div class="btn-group__name">styles</div>
    <button onclick="webcam.classList.remove('dark');">styles: default</button>
    <button onclick="webcam.classList.add('dark');">styles: dark mode</button>
  </div>

  <script>
    function changeFontSize(change) {
      const currentSize = parseInt(webcam.style.fontSize || '16px', 10);
      webcam.style.fontSize = (currentSize + change) + 'px';
    }
  </script>


  <div class="btn-group">
    <div class="btn-group__name">actions</div>
    <button onclick="changeFontSize(-1)">font -</button>
    <button onclick="changeFontSize(1)">font +</button>
    <button onclick="webcam.refreshData()">refreshData</button>
  </div>

  <div class="btn-group">
    <div class="btn-group__name">vehicle</div>
    <button onclick="webcam.vehicleType='light'">light</button>
    <button onclick="webcam.vehicleType='heavy'">heavy</button>
    <button onclick="webcam.vehicleType=undefined">(not set)</button>
  </div>

  <div class="btn-group">
    <div class="btn-group__name">source</div>
    <button onclick="webcam.sourceType='tollgate'">tollgate</button>
    <button onclick="webcam.sourceType='tvcc'">tvcc</button>
    <button onclick="webcam.sourceType='unknown'">(unknown)</button>
    <button onclick="webcam.sourceType=undefined">(not set)</button>
  </div>
</div>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet">
<style>
  noi-a22-travel-times {
    font-family: "Roboto", serif;
    outline: 1px solid red;
  }

  noi-a22-travel-times.dark {
    font-family: cursive;
    outline: 1px solid red;

    --color-primary: rgb(224, 224, 224);
    --color-secondary: rgb(224, 224, 224);
    --color-text: #EEE;
    --color-background: #333;
    --color-border: #DDD;

    --color-busy-regular: #159b60;
    --color-busy-light: #6c9a0b;
    --color-busy-severe: #9a720a;
    --color-busy-heavy: #9a4c1a;
    --color-busy-critical: #9a1322;
    --color-busy-empty: #4c4c4c;
    --color-busy-empty-contrast: #FFFFFF;

    --color-car-light: #18a767;
    --color-car-heavy: #FF7F2C;
    --color-car-handle: #EEE;

    --scrollbar-color: #777;
    --scrollbar-bg: #444;
  }
</style>


<style>
  .btn-group {
    display: inline-flex;
    align-items: center;
    gap: 0.5ch;
    position: relative;

    padding: 4px;
    padding-bottom: 3ch;
    margin: 2px;
    border: 1px solid gray;
    border-radius: 4px;
  }

  .btn-group .btn-group__name {
    padding: 4px;
    padding-right: 1ch;

    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    text-align: center;
    text-transform: lowercase;
  }
</style>

</body>

</html>
